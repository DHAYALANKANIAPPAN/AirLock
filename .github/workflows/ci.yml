name: Airlock CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Test Suite (Pytest)
      run: |
        pytest -v

    - name: Run Standard Library Unit Tests
      run: |
        python -m unittest discover tests

    - name: Run Decider 2B Smoke Test
      run: |
        python eval/run_decider_smoke.py

    - name: Run Gate 2 Calibration Study
      run: |
        python eval/calibrate_gate2.py

    - name: Run Calibration & Reliability Diagram Generator
      run: |
        python eval/calibration_plot.py
